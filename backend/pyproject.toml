[project]
name = "tenderai-backend"
version = "0.1.0"
description = "Тендер-Сверка: API va workerlar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.13.0",
    "boto3>=1.43.111",
    "celery[redis]>=5.6.3",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "redis>=6.4.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.111",
    "celery-types>=0.26.0",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "ASYNC", "RUF"]
# Tender documents are Russian and Uzbek: Cyrillic in strings and comments is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Label dictionaries for three report languages read better one language per line.
"app/pipeline/report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "openpyxl.*", "weasyprint", "pillow_heif"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
