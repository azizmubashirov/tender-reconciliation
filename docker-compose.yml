name: tenderai

x-backend: &backend
  build: ./backend
  image: tenderai-backend:dev
  environment:
    ENV: local
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tenderai}:${POSTGRES_PASSWORD:-tenderai}@postgres:5432/${POSTGRES_DB:-tenderai}
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    S3_BUCKET: ${S3_BUCKET:-tenderai-dev}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
    CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-${CLOUDFLARE_ACCOUNT_ID:-}}
    CF_AI_GATEWAY_ID: ${CF_AI_GATEWAY_ID:-${CLOUDFLARE_GATEWAY_ID:-}}
    CF_AIG_TOKEN: ${CF_AIG_TOKEN:-${CLOUDFLARE_API_TOKEN:-}}
    CF_ENABLED: ${CF_ENABLED:-${CLOUDFLARE_ENABLED:-}}
  volumes:
    - ./backend/app:/app/app
    # Local file storage when R2 is not configured; shared by api and worker.
    - storage:/data/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenderai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderai}
      POSTGRES_DB: ${POSTGRES_DB:-tenderai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app"]
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6

  worker:
    <<: *backend
    # watchfiles restarts the worker when code changes (Celery has no autoreload).
    command: ["watchfiles", "--filter", "python", "celery -A app.workers.celery_app:celery_app worker -Q ingest,ocr,llm,core,report --concurrency 2 --loglevel INFO", "/app/app"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 > /dev/null"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Upload antivirus (needed from Sprint 1, I-02). Heavy: ~1.5 GB RAM, signature download on first start.
  clamav:
    image: clamav/clamav-debian:stable
    profiles: ["av"]
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

volumes:
  storage:
  pgdata:
  redisdata:
  clamdb:
