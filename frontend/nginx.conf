server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads: up to 500 MB per package (TZ §3.1); nginx's default of 1 MB rejects ordinary PDFs.
    client_max_body_size 500m;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Docker's DNS: re-resolve "api" instead of caching its IP, so the site survives API restarts.
    resolver 127.0.0.11 valid=5s;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE progress stream (docs/ARCHITECTURE.md §8)
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
